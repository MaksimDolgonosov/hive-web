<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF8ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0A08" media="(prefers-color-scheme: dark)" />
    <title>Hive — A social map of moments</title>
    <meta
      name="description"
      content="Hive is a social map of moments. Photos are taken on the spot, stay on the map from 4 to 72 hours, and then disappear."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          font-family: system-ui, sans-serif;
          max-width: 40rem;
          margin: 2rem auto;
          padding: 0 1.25rem;
          line-height: 1.65;
          color: #2c1810;
        "
      >
        <p style="font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Hive</p>
        <h1 style="font-size: 1.75rem; line-height: 1.2">Delete your Hive account</h1>
        <p>
          In the Hive app: Profile → Settings → Delete account. If the app is not on your device,
          email
          <a href="mailto:hive.app.site@gmail.com?subject=Delete%20my%20Hive%20account"
            >hive.app.site@gmail.com</a
          >
          from the address linked to your account. We delete your profile, photos, sessions, likes,
          and reactions. Some data may be kept longer when the law requires it or to protect the
          service from abuse. Email requests are processed within 30 days.
        </p>
        <h2>Удаление аккаунта Hive</h2>
        <p>
          В приложении: Профиль → Настройки → Удалить аккаунт. Если приложения нет, напишите на
          <a href="mailto:hive.app.site@gmail.com?subject=Delete%20my%20Hive%20account"
            >hive.app.site@gmail.com</a
          >
          с почты, привязанной к аккаунту. Удаляются профиль, фото, сессии, лайки и реакции. Часть
          данных может храниться дольше, если это требуется по закону или для защиты от
          злоупотреблений. Письмо обрабатывается в течение 30 дней.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
